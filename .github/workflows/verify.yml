name: Verify Kreativa

on:
  push:
    branches:
      - main
      - repair/kreativa-structure
      - repair/kreativa-stability-2026-11-28
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
